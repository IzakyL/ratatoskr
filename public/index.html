<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ratatoskr</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f4f5;
        --panel: #ffffff;
        --subtle: #fafafa;
        --border: #e2e2e5;
        --text: #1f1f23;
        --muted: #6b6b73;
        /* One colour for anything you can act on; everything else stays grey. */
        --primary: #0a5ad6;
        --primary-hover: #0848ab;
        --primary-fg: #ffffff;
        --focus: #0a5ad6;
        --danger: #c02b2b;
        --radius: 4px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161618;
          --panel: #1e1e21;
          --subtle: #232327;
          --border: #34343a;
          --text: #ececef;
          --muted: #9a9aa3;
          --primary: #3b82f6;
          --primary-hover: #5b96f7;
          --primary-fg: #ffffff;
          --focus: #5b96f7;
          --danger: #ef6b6b;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h2, h3, p { margin: 0; }
      [hidden] { display: none !important; }
      code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.92em; }
      .muted { color: var(--muted); font-size: 13px; }

      /* ---------- top bar ---------- */
      .topbar {
        position: sticky; top: 0; z-index: 1;
        height: 48px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      .topbar .inner {
        display: flex; align-items: center; gap: 12px;
        max-width: 72rem; height: 100%; margin: 0 auto; padding: 0 16px;
      }
      .brand { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
      .topbar .tagline { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      #whoami { color: var(--muted); }
      @media (max-width: 36rem) { .topbar .tagline, #whoami { display: none; } .brand { flex: 1; } }

      /* ---------- layout ---------- */
      main { max-width: 72rem; margin: 0 auto; padding: 24px 16px 48px; }
      #auth { max-width: 24rem; margin: 40px auto 0; }
      #dash { display: grid; gap: 16px; max-width: 40rem; margin: 0 auto; }
      #dash .column { display: grid; gap: 16px; align-content: start; }
      /* An administrator gets a second column; everyone else a single narrow one. */
      @media (min-width: 60rem) {
        #dash.admin { max-width: none; grid-template-columns: 22rem minmax(0, 1fr); align-items: start; }
        #dash.admin > #new-password { grid-column: 1 / -1; }
      }

      /* ---------- cards ---------- */
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .card-head { padding: 14px 16px 0; }
      .card-head h2 { font-size: 14px; font-weight: 600; }
      .card-head p { margin-top: 2px; }
      .card-body { padding: 12px 16px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
      .card-body + .card-body { border-top: 1px solid var(--border); }
      .card.warning { border-color: var(--danger); }
      .card-head + .rows { margin-top: 12px; }

      /* ---------- controls ---------- */
      label.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
      input[type="text"], input[type="email"], input[type="password"], input[type="url"], input[type="file"], select {
        width: 100%;
        height: 32px;
        padding: 0 10px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        font: inherit;
        font-size: 13px;
      }
      input[type="file"] { padding: 3px 4px; color: var(--muted); cursor: pointer; }
      input[type="file"]::file-selector-button {
        height: 24px; margin-right: 8px; padding: 0 10px;
        background: var(--subtle);
        border: 1px solid var(--border);
        border-radius: 3px;
        color: var(--text);
        font: inherit; font-size: 12px;
        cursor: pointer;
      }
      select { width: auto; padding: 0 6px; cursor: pointer; }
      input[type="radio"] { accent-color: var(--primary); margin: 0; }
      input:focus-visible, select:focus-visible, button:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 1px;
      }
      button {
        height: 32px;
        padding: 0 12px;
        border: 1px solid transparent;
        border-radius: var(--radius);
        background: var(--primary);
        color: var(--primary-fg);
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        cursor: pointer;
      }
      button:hover { background: var(--primary-hover); }
      button.secondary { background: var(--panel); border-color: var(--border); color: var(--text); }
      button.secondary:hover { background: var(--subtle); border-color: var(--muted); }
      button.danger { background: var(--panel); border-color: var(--border); color: var(--danger); }
      button.danger:hover { background: var(--subtle); border-color: var(--danger); }
      button.sm { height: 26px; padding: 0 8px; font-size: 12px; }
      button.link {
        height: auto; padding: 0; background: none; border: none;
        color: var(--primary); font-weight: 400;
      }
      button.link:hover { background: none; text-decoration: underline; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .row > .grow { flex: 1; min-width: 8rem; }
      .radios { display: flex; gap: 16px; font-size: 13px; }
      .radios label { display: flex; align-items: center; gap: 6px; }

      .copybox {
        display: flex; gap: 8px; align-items: center;
        height: 36px; padding: 0 4px 0 10px;
        background: var(--subtle);
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }
      .copybox span { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font-size: 13px; }

      .profile { display: flex; gap: 12px; align-items: center; }
      .profile img {
        width: 64px; height: 64px; flex: none;
        image-rendering: pixelated;
        background: var(--subtle);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        object-fit: contain;
      }
      .profile > div { min-width: 0; }
      .profile .mono { word-break: break-all; }
      #profile-id { font-size: 12px; }

      .note {
        padding: 8px 10px;
        border-radius: var(--radius);
        font-size: 13px;
        background: var(--subtle);
        border: 1px solid var(--border);
        border-left: 3px solid var(--muted);
      }
      .note.error { color: var(--danger); border-left-color: var(--danger); }
      .note.ok { border-left-color: var(--primary); }
      .card > .note { margin: 0 16px 16px; }

      /* ---------- lists: one row per item, flush with the card edges ---------- */
      .rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
      .rows li {
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        min-height: 44px; padding: 6px 16px;
        font-size: 13px;
      }
      .rows li + li { border-top: 1px solid var(--border); }
      .rows li > .grow { flex: 1; min-width: 10rem; display: grid; }
      .rows li.empty { color: var(--muted); }
      .rows li.group {
        min-height: 0; padding: 6px 16px;
        background: var(--subtle);
        color: var(--muted); font-size: 12px; font-weight: 500;
      }
      .tag {
        display: inline-block;
        padding: 0 6px; border-radius: 3px;
        background: var(--subtle); border: 1px solid var(--border);
        color: var(--muted); font-size: 11px; line-height: 18px;
      }
      .rows strong { font-weight: 600; }
      .subhead { padding: 14px 16px 8px; font-size: 13px; font-weight: 600; }
    </style>
  </head>
  <body>
    <nav class="topbar">
      <div class="inner">
        <span class="brand">Ratatoskr</span>
        <span class="tagline muted" data-i18n="tagline"></span>
        <span id="whoami" class="mono" hidden></span>
        <select id="lang" aria-label="Language">
          <option value="en">English</option>
          <option value="zh-CN">中文</option>
        </select>
        <button type="button" class="secondary sm" id="logout" data-i18n="signOut" hidden></button>
      </div>
    </nav>

    <main>
      <!-- Signed out -->
      <section id="auth" class="card">
        <div class="card-head">
          <h2 id="auth-title" data-i18n="signIn"></h2>
        </div>

        <!-- Safari only offers to save a password when a form really submits.
             Signing in happens over fetch, so once it succeeds the form is
             submitted again into this frame, which the server answers with an
             empty page. The page itself never navigates. -->
        <iframe name="login-sink" hidden></iframe>
        <form id="login-form" class="card-body" method="post" action="/login" target="login-sink">
          <label class="field">
            <span data-i18n="emailOrCharacter"></span>
            <input type="text" name="username" autocomplete="username" required />
          </label>
          <label class="field">
            <span data-i18n="password"></span>
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <div class="row">
            <button type="submit" data-i18n="signIn"></button>
            <button type="button" class="link" data-switch="register" data-i18n="toRegister"></button>
          </div>
        </form>

        <form id="register-form" class="card-body" hidden>
          <label class="field">
            <span data-i18n="email"></span>
            <input type="email" name="email" autocomplete="email" required />
          </label>
          <label class="field">
            <span data-i18n="characterName"></span>
            <input type="text" name="profileName" pattern="[A-Za-z0-9_]{3,16}" required />
          </label>
          <label class="field">
            <span data-i18n="inviteCode"></span>
            <input type="text" name="inviteCode" required />
          </label>
          <p class="muted" data-i18n="passwordIsGenerated"></p>
          <div class="row">
            <button type="submit" data-i18n="register"></button>
            <button type="button" class="link" data-switch="login" data-i18n="toSignIn"></button>
          </div>
        </form>

        <div id="auth-note" class="note" hidden></div>
      </section>

      <!-- Signed in -->
      <div id="dash" hidden>
        <!-- Shown once: after registration, or after an admin reissues a password.
             Neither can be recovered afterwards, so the heading is set in place. -->
        <section id="new-password" class="card warning" hidden>
          <div class="card-head">
            <h2 id="password-title"></h2>
            <p class="muted" data-i18n="passwordWarning"></p>
          </div>
          <div class="card-body">
            <div class="copybox">
              <span id="password-value" class="mono"></span>
              <button type="button" class="secondary sm" id="copy-password" data-i18n="copy"></button>
            </div>
            <div class="row">
              <button type="button" class="secondary" id="dismiss-password" data-i18n="passwordSaved"></button>
            </div>
          </div>
        </section>

        <div class="column" id="mine">
          <section class="card" id="account">
            <div class="card-head">
              <h2 data-i18n="skinSection"></h2>
            </div>
            <div class="card-body">
              <div class="profile">
                <img id="skin-preview" alt="" />
                <div>
                  <strong id="profile-name" class="mono"></strong>
                  <p class="muted mono" id="profile-id"></p>
                  <p class="muted" id="skin-status"></p>
                </div>
              </div>
            </div>

            <form id="skin-form" class="card-body">
              <label class="field">
                <span data-i18n="skinFile"></span>
                <input type="file" name="file" accept="image/png" required />
              </label>
              <div class="radios">
                <label><input type="radio" name="model" value="default" checked /> <span data-i18n="modelClassic"></span></label>
                <label><input type="radio" name="model" value="slim" /> <span data-i18n="modelSlim"></span></label>
              </div>
              <div class="row">
                <button type="submit" data-i18n="uploadSkin"></button>
                <button type="button" class="danger" id="delete-skin" data-i18n="deleteSkin"></button>
              </div>
            </form>

            <form id="cape-form" class="card-body">
              <label class="field">
                <span data-i18n="capeFile"></span>
                <input type="file" name="file" accept="image/png" required />
              </label>
              <div class="row">
                <button type="submit" data-i18n="uploadCape"></button>
                <button type="button" class="danger" id="delete-cape" data-i18n="deleteCape"></button>
              </div>
            </form>

            <div id="account-note" class="note" hidden></div>
          </section>

          <section class="card">
            <div class="card-head">
              <h2 data-i18n="launcherSection"></h2>
              <p class="muted" data-i18n="launcherHint"></p>
            </div>
            <div class="card-body">
              <div class="copybox">
                <span id="yggdrasil-url" class="mono"></span>
                <button type="button" class="secondary sm" id="copy-url" data-i18n="copy"></button>
              </div>
            </div>
          </section>
        </div>

        <!-- Only rendered for an account with is_admin; the API is the real guard. -->
        <div class="column" id="admin" hidden>
          <div id="admin-note" class="note" hidden></div>

          <section class="card">
            <div class="card-head">
              <h2 data-i18n="invitesHeading"></h2>
              <p class="muted" data-i18n="invitesHint"></p>
            </div>
            <form id="mint-form" class="card-body">
              <div class="row">
                <input type="text" name="note" id="invite-note" class="grow" />
                <button type="submit" data-i18n="mintInvite"></button>
              </div>
            </form>
            <ul id="invite-list" class="rows"></ul>
          </section>

          <section class="card">
            <div class="card-head">
              <h2 data-i18n="accountsHeading"></h2>
            </div>
            <ul id="account-list" class="rows"></ul>
          </section>

          <!-- Bridge mode: the services whose players may also join, and those players. -->
          <section class="card">
            <div class="card-head">
              <h2 data-i18n="bridgeSection"></h2>
              <p class="muted" data-i18n="bridgeHint"></p>
            </div>
            <form id="source-form" class="card-body">
              <div class="row">
                <select id="source-kind" aria-label="Type">
                  <option value="yggdrasil" data-i18n="sourceKindYggdrasil"></option>
                  <option value="mojang" data-i18n="sourceKindMojang"></option>
                </select>
                <input type="text" id="source-label" class="grow" style="max-width: 9rem" />
                <input type="url" id="source-address" class="grow" />
                <button type="submit" data-i18n="addSource"></button>
              </div>
            </form>
            <ul id="source-list" class="rows"></ul>

            <h3 class="subhead" data-i18n="bridgedHeading"></h3>
            <ul id="bridged-list" class="rows"></ul>
          </section>
        </div>
      </div>
    </main>

      };

      let lang = localStorage.getItem('ratatoskr-lang');
      if (!STRINGS[lang]) lang = navigator.language?.startsWith('zh') ? 'zh-CN' : 'en';

      const t = (key, params = {}) =>
        String(STRINGS[lang][key] ?? key).replace(/\{(\w+)\}/g, (_, name) => params[name] ?? '');

      const PLACEHOLDERS = {
        'invite-note': 'inviteNotePlaceholder',
        'source-label': 'sourceLabelPlaceholder',
        'source-address': 'sourceAddressPlaceholder',
      };

      function setLanguage(next) {
        lang = next;
        localStorage.setItem('ratatoskr-lang', next);
        document.documentElement.lang = next;
        $('lang').value = next;
        for (const el of document.querySelectorAll('[data-i18n]')) {
          el.textContent = t(el.dataset.i18n);
        }
        for (const [id, key] of Object.entries(PLACEHOLDERS)) $(id).placeholder = t(key);
        render();
      }

      $('lang').addEventListener('change', (event) => setLanguage(event.target.value));

      /* ---------- session ---------- */

      const session = {
        get() {
          try { return JSON.parse(localStorage.getItem('ratatoskr') ?? 'null'); } catch { return null; }
        },
        set(value) { localStorage.setItem('ratatoskr', JSON.stringify(value)); },
        clear() { localStorage.removeItem('ratatoskr'); },
      };

      function note(el, message, kind) {
        el.textContent = message;
        el.className = `note ${kind}`;
        el.hidden = !message;
      }

      // Yggdrasil errors come back as {error, errorMessage}, and so do ours.
      // Those messages are protocol-facing and always English.
      async function post(url, body) {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (response.status === 204) return null;
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.errorMessage ?? t('requestFailed', { status: response.status }));
        }
        return data;
      }

      async function texture(method, type, form) {
        const { accessToken, profile } = session.get();
        const response = await fetch(`${YGGDRASIL}/api/user/profile/${profile.id}/${type}`, {
          method,
          headers: { authorization: `Bearer ${accessToken}` },
          body: form,
        });
        if (response.ok) return;
        const data = await response.json().catch(() => ({}));
        throw new Error(data.errorMessage ?? t('requestFailed', { status: response.status }));
      }

      /* ---------- rendering ---------- */

      // The password is shown exactly once -- on registration, or when an admin
      // reissues one -- because the server keeps only its hash.
      function showPassword(title, password) {
        $('password-title').textContent = title;
        $('password-value').textContent = password;
        $('new-password').hidden = false;
      }

      async function render() {
        const current = session.get();
        $('auth').hidden = !!current;
        $('dash').hidden = !current;
        $('logout').hidden = !current;
        $('whoami').hidden = !current;
        await renderAdmin();
        if (!current) return;

        $('whoami').textContent = current.profile.name;
        $('profile-name').textContent = current.profile.name;
        $('profile-id').textContent = current.profile.id;
        $('yggdrasil-url').textContent = YGGDRASIL;

        // Read the skin back from the public profile endpoint: the same data the
        // game sees, so the preview cannot drift from what is served in-game.
        const response = await fetch(
          `${YGGDRASIL}/sessionserver/session/minecraft/profile/${current.profile.id}`,
        );
        const preview = $('skin-preview');
        if (response.status !== 200) {
          preview.removeAttribute('src');
          $('skin-status').textContent = t('noSkin');
          return;
        }

        const profile = await response.json();
        const property = profile.properties?.find((p) => p.name === 'textures');
        const textures = property ? JSON.parse(atob(property.value)).textures : {};

        if (textures.SKIN) {
          preview.src = textures.SKIN.url;
          const model = t(textures.SKIN.metadata?.model === 'slim' ? 'modelSlim' : 'modelClassic');
          $('skin-status').textContent = t(textures.CAPE ? 'skinAndCapeSet' : 'skinSet', { model });
        } else {
          preview.removeAttribute('src');
          $('skin-status').textContent = t(textures.CAPE ? 'capeOnly' : 'noSkin');
        }
      }

      /* ---------- authentication ---------- */

      for (const button of document.querySelectorAll('[data-switch]')) {
        button.addEventListener('click', () => {
          const toRegister = button.dataset.switch === 'register';
          $('login-form').hidden = toRegister;
          $('register-form').hidden = !toRegister;
          $('auth-title').textContent = t(toRegister ? 'register' : 'signIn');
          note($('auth-note'), '', '');
        });
      }

      $('login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = new FormData(event.target);
        try {
          const data = await post(`${YGGDRASIL}/authserver/authenticate`, {
            username: form.get('username'),
            password: form.get('password'),
            agent: { name: 'Minecraft', version: 1 },
          });
          if (!data.selectedProfile) throw new Error(t('noCharacter'));
          session.set({
            accessToken: data.accessToken,
            clientToken: data.clientToken,
            profile: data.selectedProfile,
          });
          // submit() skips the submit event, so this does not loop. The field
          // values are captured synchronously, so resetting right after is safe.
          event.target.submit();
          event.target.reset();
          note($('auth-note'), '', '');
          await render();
        } catch (error) {
          note($('auth-note'), error.message, 'error');
        }
      });

      $('register-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = new FormData(event.target);
        try {
          // The password is generated server-side and never shown again.
          const { password } = await post('/api/register', Object.fromEntries(form));
          const data = await post(`${YGGDRASIL}/authserver/authenticate`, {
            username: form.get('email'),
            password,
            agent: { name: 'Minecraft', version: 1 },
          });
          session.set({
            accessToken: data.accessToken,
            clientToken: data.clientToken,
            profile: data.selectedProfile,
          });
          event.target.reset();
          note($('auth-note'), '', '');
          showPassword(t('yourPassword'), password);
          await render();
        } catch (error) {
          note($('auth-note'), error.message, 'error');
        }
      });

      $('logout').addEventListener('click', async () => {
        const current = session.get();
        session.clear();
        await render();
        if (current) {
          post(`${YGGDRASIL}/authserver/invalidate`, {
            accessToken: current.accessToken,
            clientToken: current.clientToken,
          }).catch(() => {});
        }
      });

      /* ---------- textures ---------- */

      async function withNote(action, successKey) {
        try {
          await action();
          note($('account-note'), t(successKey), 'ok');
          await render();
        } catch (error) {
          // An expired token is the one failure worth handling specially.
          if (error.message === 'Invalid token.') {
            session.clear();
            await render();
            note($('auth-note'), t('sessionExpired'), 'error');
            return;
          }
          note($('account-note'), error.message, 'error');
        }
      }

      $('skin-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const form = new FormData(event.target);
        withNote(() => texture('PUT', 'skin', form), 'skinUpdated');
      });

      $('cape-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const form = new FormData(event.target);
        withNote(() => texture('PUT', 'cape', form), 'capeUpdated');
      });

      $('delete-skin').addEventListener('click', () =>
        withNote(() => texture('DELETE', 'skin'), 'skinDeleted'),
      );
      $('delete-cape').addEventListener('click', () =>
        withNote(() => texture('DELETE', 'cape'), 'capeDeleted'),
      );

      /* ---------- clipboard ---------- */

      for (const [id, source] of [['copy-url', 'yggdrasil-url'], ['copy-password', 'password-value']]) {
        $(id).addEventListener('click', async () => {
          await navigator.clipboard.writeText($(source).textContent);
          $(id).textContent = t('copied');
          setTimeout(() => ($(id).textContent = t('copy')), 1500);
        });
      }

      $('dismiss-password').addEventListener('click', () => {
        $('password-value').textContent = '';
        $('new-password').hidden = true;
      });

      /* ---------- administration ----------
       * Shown only to an account the API answers /admin/state for. Hiding the
       * column is a courtesy; the token check on the server is the real guard.
       */

      async function adminRequest(method, path, body) {
        const current = session.get();
        if (!current) return null;
        const response = await fetch(`/api/admin${path}`, {
          method,
          headers: {
            authorization: `Bearer ${current.accessToken}`,
            ...(body ? { 'content-type': 'application/json' } : {}),
          },
          body: body ? JSON.stringify(body) : undefined,
        });
        if (response.status === 403) return null; // not an admin, or the token died
        if (response.status === 204) return {};
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.errorMessage ?? t('requestFailed', { status: response.status }));
        }
        return data;
      }

      const day = (ms) => new Date(ms).toLocaleDateString(lang);

      function row(...children) {
        const li = document.createElement('li');
        li.append(...children);
        return li;
      }

      function span(text, className) {
        const el = document.createElement('span');
        el.textContent = text;
        if (className) el.className = className;
        return el;
      }

      /** A name on the first line, details below it; takes the row's free space. */
      function details(title, tags, meta) {
        const box = document.createElement('div');
        box.className = 'grow';
        const line = document.createElement('span');
        line.append(Object.assign(document.createElement('strong'), { textContent: title, className: 'mono' }));
        for (const tag of tags) line.append(' ', span(tag, 'tag'));
        box.append(line);
        if (meta) box.append(span(meta, 'muted'));
        return box;
      }

      function action(labelKey, onClick, className = 'secondary') {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `${className} sm`;
        button.textContent = t(labelKey);
        button.addEventListener('click', onClick);
        return button;
      }

      function listItem(className, text) {
        const li = document.createElement('li');
        li.className = className;
        li.textContent = text;
        return li;
      }

      async function renderAdmin() {
        const state = await adminRequest('GET', '/state').catch(() => null);
        $('admin').hidden = !state;
        $('dash').classList.toggle('admin', !!state);
        if (!state) return;

        const invites = state.invites.map((invite) =>
          row(
            span(invite.code, 'mono grow'),
            invite.note ? span(invite.note, 'muted') : '',
            span(
              invite.used_at ? t('inviteUsed', { date: day(invite.used_at) }) : t('inviteUnused'),
              'tag',
            ),
            ...(invite.used_at
              ? []
              : [
                  action('copy', async (event) => {
                    await navigator.clipboard.writeText(invite.code);
                    event.target.textContent = t('copied');
                  }),
                  action('revoke', () =>
                    adminAction(() => adminRequest('DELETE', `/invites/${invite.code}`), 'inviteRevoked'),
                  'danger'),
                ]),
          ),
        );
        $('invite-list').replaceChildren(...(invites.length ? invites : [listItem('empty', t('noInvites'))]));

        const accounts = state.accounts.map((account) => {
          const label = account.profile_name ?? account.email;
          return row(
            details(
              account.profile_name ?? '—',
              account.is_admin ? [t('adminTag')] : [],
              `${account.email} · ${t('registered', { date: day(account.created_at) })}`,
            ),
            action('resetPassword', async () => {
              if (!confirm(t('confirmReset', { name: label }))) return;
              await adminAction(async () => {
                const { password } = await adminRequest('POST', `/accounts/${account.id}/password`);
                showPassword(t('passwordFor', { name: label }), password);
                // Resetting your own password invalidates the token you are
                // holding, so the reload that follows would sign you out.
                if (account.id === state.self) session.clear();
              });
            }),
            // The API refuses this anyway; not offering it is just tidier.
            ...(account.id === state.self
              ? []
              : [
                  action('deleteAccount', async () => {
                    if (!confirm(t('confirmDelete', { name: label }))) return;
                    await adminAction(
                      () => adminRequest('DELETE', `/accounts/${account.id}`),
                      'accountDeleted',
                    );
                  }, 'danger'),
                ]),
          );
        });
        $('account-list').replaceChildren(...(accounts.length ? accounts : [listItem('empty', t('noAccounts'))]));

        renderBridge(state.upstreams ?? [], state.bridged ?? []);
      }

      const sourceName = (label) => (label === 'mojang' ? t('sourceKindMojang') : label);

      function renderBridge(upstreams, bridged) {
        const bySource = new Map(upstreams.map((u) => [u.label, []]));
        for (const player of bridged) {
          if (!bySource.has(player.source)) bySource.set(player.source, []);
          bySource.get(player.source).push(player);
        }

        const sources = upstreams.map((upstream) => {
          const count = bySource.get(upstream.label).length;
          return row(
            details(
              sourceName(upstream.label),
              [t('playerCount', { count })],
              upstream.api_root ?? 'sessionserver.mojang.com',
            ),
            action('removeSource', async () => {
              if (!confirm(t('confirmRemoveSource', { name: sourceName(upstream.label), count }))) return;
              await adminAction(
                () => adminRequest('DELETE', `/upstreams/${encodeURIComponent(upstream.label)}`),
                'sourceRemoved',
              );
            }, 'danger'),
          );
        });
        $('source-list').replaceChildren(...(sources.length ? sources : [listItem('empty', t('noSources'))]));

        // Players grouped under the service that vouched for them. A source that
        // is not configured cannot let its players in, but their names stay held
        // until released, so they are still listed.
        const configured = new Set(upstreams.map((u) => u.label));
        const players = [];
        for (const [source, group] of bySource) {
          if (group.length === 0) continue;
          const missing = configured.has(source) ? '' : ` · ${t('sourceMissing')}`;
          players.push(listItem('group', `${sourceName(source)} · ${group.length}${missing}`));
          for (const player of group) {
            players.push(row(
              details(player.name, [], t('lastSeen', { date: day(player.last_seen) })),
              action('release', async () => {
                if (!confirm(t('confirmRelease', { name: player.name }))) return;
                await adminAction(
                  () => adminRequest('DELETE', `/bridged/${player.id}`),
                  'bridgedReleased',
                );
              }),
            ));
          }
        }
        $('bridged-list').replaceChildren(...(players.length ? players : [listItem('empty', t('noBridged'))]));
      }

      /** Runs an admin mutation, reports it, and redraws the lists. */
      async function adminAction(mutate, successKey) {
        try {
          await mutate();
          note($('admin-note'), successKey ? t(successKey) : '', successKey ? 'ok' : '');
          await render();
        } catch (error) {
          note($('admin-note'), error.message, 'error');
        }
      }

      $('mint-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const inviteNote = $('invite-note').value.trim();
        adminAction(async () => {
          await adminRequest('POST', '/invites', inviteNote ? { note: inviteNote } : {});
          $('invite-note').value = '';
        }, 'inviteIssued');
      });

      // Mojang needs neither a label nor an address: there is only one of it.
      function syncSourceKind() {
        const mojang = $('source-kind').value === 'mojang';
        $('source-label').hidden = mojang;
        $('source-address').hidden = mojang;
        $('source-label').required = !mojang;
        $('source-address').required = !mojang;
      }
      $('source-kind').addEventListener('change', syncSourceKind);
      syncSourceKind();

      $('source-form').addEventListener('submit', (event) => {
        event.preventDefault();
        const mojang = $('source-kind').value === 'mojang';
        const body = mojang
          ? { label: 'mojang' }
          : { label: $('source-label').value.trim(), apiRoot: $('source-address').value.trim() };
        adminAction(async () => {
          await adminRequest('POST', '/upstreams', body);
          $('source-label').value = '';
          $('source-address').value = '';
        }, 'sourceAdded');
      });

      setLanguage(lang);
    </script>
  </body>
</html>
